name: Build and Release

on:
  push:
    branches:
      - main
    # A release is published for the version in VERSION, so only a bump should
    # trigger one; other merges would rebuild and overwrite the existing release.
    paths:
      - VERSION

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Run Tests
        run: go test -v ./...

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(cat VERSION)
          GOOS=linux GOARCH=${{ matrix.arch }} go build -ldflags="-X 'main.Version=$VERSION'" -o ollama-symlinks-linux-${{ matrix.arch }} ./cmd/ollama-symlinks
          echo "ollama-symlinks-linux-${{ matrix.arch }}=$VERSION" >> $GITHUB_OUTPUT

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=$(cat VERSION)
          GOOS=darwin GOARCH=${{ matrix.arch }} go build -ldflags="-X 'main.Version=$VERSION'" -o ollama-symlinks-macos-${{ matrix.arch }} ./cmd/ollama-symlinks
          codesign --force --deep --sign - ollama-symlinks-macos-${{ matrix.arch }}
          echo "ollama-symlinks-macos-${{ matrix.arch }}=$VERSION" >> $GITHUB_OUTPUT

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = Get-Content -Path VERSION
          $env:VERSION = $version
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          go build -ldflags="-X 'main.Version=$env:VERSION'" -o ollama-symlinks-windows-${{ matrix.arch }}.exe ./cmd/ollama-symlinks
          echo "ollama-symlinks-windows-${{ matrix.arch }}=$env:VERSION" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ollama-symlinks-*
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
      id-token: write # sign build provenance with GitHub's OIDC identity
      attestations: write # store the provenance attestation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Generate checksums
        run: |
          find . -name "ollama-symlinks-*" -type f -exec sha256sum {} \; | sed 's|  .*/|  |' > checksums.txt
          cat checksums.txt

      # Lets users prove a binary was built by this workflow from this repository:
      #   gh attestation verify <file> --repo qaribhaider/ollama-to-lmstudio-symlinks
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            binaries-*/ollama-symlinks-*
            checksums.txt

      - name: Read VERSION file
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Fail if the release tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.VERSION }}" >/dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.VERSION }} already exists. Bump VERSION to publish a new release."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Release of ollama-symlinks version ${{ steps.version.outputs.VERSION }}

            ## 🚀 Installation

            ### Linux & macOS (Quick Install)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            ### Windows
            Download the appropriate `.exe` file for your architecture from the releases section below.

            ## 🗑️ Uninstallation
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/uninstall.sh | bash
            ```

            ## 📖 Usage
            ```bash
            ollama-symlinks --help
            ollama-symlinks --version
            ```
          files: |
            checksums.txt
            binaries-ubuntu-latest-amd64/ollama-symlinks-linux-amd64
            binaries-ubuntu-latest-arm64/ollama-symlinks-linux-arm64
            binaries-macos-latest-amd64/ollama-symlinks-macos-amd64
            binaries-macos-latest-arm64/ollama-symlinks-macos-arm64
            binaries-windows-latest-amd64/ollama-symlinks-windows-amd64.exe
            binaries-windows-latest-arm64/ollama-symlinks-windows-arm64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
