name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # Existing code has unresolved findings, so only report issues in the PR's changes.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          only-new-issues: true

      - name: Run Tests
        run: go test -v ./...

      - name: Verify Build
        run: |
          VERSION=$(cat VERSION)
          go build -ldflags="-X 'main.Version=$VERSION'" -o ollama-symlinks ./cmd/ollama-symlinks
          ./ollama-symlinks --version
