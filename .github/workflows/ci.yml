name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

      # Fails when the code calls a vulnerable function in the standard library
      # or a dependency. Version pinned; bump it when updating Go.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Verify Build
        run: |
          VERSION=$(cat VERSION)
          go build -ldflags="-X 'main.Version=$VERSION'" -o ollama-symlinks ./cmd/ollama-symlinks
          ./ollama-symlinks --version
